    <script>
        // --------------------------------------------------------------

        const quizData = [{
            id: 1,
            q: 'A 56-year-old chronic alcoholic with a 1-year history of ascites is admitted with a 2-day history of diffuse abdominal pain and fever. Diagnostic paracentesis yields slightly cloudy ascitic fluid with an absolute polymorphonuclear (PMN) cell count of 1000/μL. Intravenous antibiotic therapy is initiated. Which statement about his treatment is true?',
            options: [
                'Antibiotic therapy is unnecessary if the ascitic fluid culture is negative for bacteria.',
                'Repeated paracenteses are required to assess the response to antibiotic treatment.',
                'The addition of albumin to antibiotic therapy improves survival.',
                'After treatment of this acute episode, a recurrent episode of spontaneous bacterial peritonitis would be unlikely.'
            ],
            correct: 'c'
        }, {
            id: 2,
            q: 'A 52-year-old man with cirrhosis presents with massive hematemesis and hypotension. Endoscopy confirms actively bleeding esophageal varices. Which pharmacologic agent should be initiated immediately before endoscopy?',
            options: [
                'Ursodeoxycholic acid',
                'Octreotide',
                'Metoclopramide',
                'Omeprazole'
            ],
            correct: 'b'
        }, {
            id: 3,
            q: 'A patient with decompensated cirrhosis has refractory ascites, recurrent variceal bleeding, and hepatic encephalopathy. What is the most appropriate next step?',
            options: [
                'Splenectomy',
                'Oral steroids',
                'Repeat liver biopsy',
                'Liver transplantation referral'
            ],
            correct: 'd'
        }, {
            id: 4,
            q: 'A chronic alcoholic presents with AST:ALT ratio >2:1. Which diagnosis is most likely?',
            options: [
                'Alcoholic hepatitis',
                'Wilson disease',
                'Hemochromatosis',
                'Acute viral hepatitis'
            ],
            correct: 'a'
        }, {
            id: 5,
            q: 'A patient with cirrhosis becomes increasingly drowsy and develops reversal of sleep rhythm. Which finding represents the earliest manifestation of hepatic encephalopathy?',
            options: [
                'Hyperreflexia',
                'Daytime somnolence',
                'Asterixis',
                'Personality and sleep changes'
            ],
            correct: 'd'
        }, {
            id: 6,
            q: 'A 48-year-old obese woman presents with acute, severe right upper quadrant pain radiating to her right scapula, accompanied by fever and nausea. Abdominal ultrasound shows gallstones but lacks definitive evidence of gallbladder wall thickening. Clinical suspicion for cystic duct obstruction (acute cholecystitis) remains high. Which is the most sensitive next step and test of choice to confirm the diagnosis?',
            options: [
                'Hepatobiliary iminodiacetic acid (HIDA) scan',
                'Magnetic resonance cholangiopancreatography (MRCP)',

                'Endoscopic retrograde cholangiopancreatography (ERCP)'

            correct: 'a'
        }, {
            id: 7,
            q: 'A 45-year-old male with a history of alcohol use disorder presents with large-volume hematemesis, tachycardia, and hypotension. While preparing for endoscopy, a continuous intravenous infusion of octreotide is initiated to lower splanchnic blood flow. This pharmacological agent would be least appropriate for the management of which co-existing condition if present?',

                'Pancreatic ascites',
                'Ulcerative colitis',
                'Short bowel syndrome',
                'Esophageal variceal bleeding'

            id: 8,
            q: 'A patient with portal hypertension develops congestive gastropathy. Which medication is most effective for long-term management?',

            id: 9,
            q: 'Serologic testing in a healthcare worker reveals isolated anti-HBs positivity. This pattern most likely indicates:',

                'Window period infection',

                'Previous vaccination'

            correct: 'd'
        }, {
            id: 10,
            q: 'A 60-year-old man presents with painless progressive jaundice, weight loss, palpable gallbladder, and markedly elevated alkaline phosphatase. Which diagnosis is most likely?',
            options: [
                'Hemolytic anemia',
                'Acute hepatitis',
                'Carcinoma head of pancreas',
                'Gilbert syndrome'
            ],
            correct: 'c'
        }, {
            id: 11,
            q: 'A patient with advanced cirrhosis undergoes bile acid analysis. Which bile acid is typically markedly reduced due to impaired intestinal bacterial conversion?',

                'Chenodeoxycholic acid',
                'Deoxycholic acid',
                'Cholic acid',
                'Glycocolic acid'
            ],
            correct: 'b'
        }, {
            id: 12,
            q: 'A young man develops recurrent mild unconjugated hyperbilirubinemia during fasting and stress. Liver enzymes are normal. Which test best confirms Gilbert syndrome?',

            correct: 'd'
        }, {

            id: 16,

            q: 'A patient with decompensated cirrhosis has markedly prolonged PT and elevated INR. Which clotting factor level is expected to remain relatively preserved?',

            q: 'A patient with hereditary hemochromatosis is expected to have which laboratory pattern?',

            id: 19,
            q: 'A patient with chronic hepatitis C and cirrhosis develops weight loss and a liver mass. Alpha-fetoprotein is elevated. Which diagnosis is most likely?',

            id: 20,
            q: 'A patient with cirrhosis develops spontaneous bacterial peritonitis. Which ascitic fluid finding is diagnostic?',

            id: 26,
            q: 'A patient with autoimmune hepatitis most commonly demonstrates which serologic marker?',

        // --------------------------------------------------------------
        // APP STATE
        // --------------------------------------------------------------
        let currentIndex = 0;
        let answers = {}; // { questionId: 'a'|'b'|'c'|'d' }
        let revealed = {}; // { questionId: true } — whether feedback has been shown

        const optionLetters = ['a', 'b', 'c', 'd'];

        // DOM refs
        const qNumber = document.getElementById('qNumber');
        const qText = document.getElementById('qText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackBox = document.getElementById('feedbackBox');
        const feedbackIcon = document.getElementById('feedbackIcon');
        const feedbackText = document.getElementById('feedbackText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const restartBtn = document.getElementById('restartBtn');
        const progressText = document.getElementById('progressText');
        const scoreBadge = document.getElementById('scoreBadge');
        const progressFill = document.getElementById('progressFill');
        const questionArea = document.getElementById('questionArea');
        const resultScreen = document.getElementById('resultScreen');
        const finalScoreNum = document.getElementById('finalScoreNum');
        const finalMessage = document.getElementById('finalMessage');
        const correctCount = document.getElementById('correctCount');
        const wrongCount = document.getElementById('wrongCount');
        const unansweredCount = document.getElementById('unansweredCount');

        // --------------------------------------------------------------
        // RENDER
        // --------------------------------------------------------------
        function renderQuestion(index) {
            const data = quizData[index];
            if (!data) return;

            qNumber.textContent = `Q${data.id}`;
            qText.textContent = data.q;

            // Build options
            optionsContainer.innerHTML = '';
            data.options.forEach((optText, i) => {
                const letter = optionLetters[i];
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.letter = letter;
                btn.innerHTML = `<span class="letter">${letter.toUpperCase()}</span> ${optText}`;

                // Check if already answered
                const answered = answers[data.id];
                if (answered) {
                    btn.classList.add('disabled');
                    const isCorrect = (letter === data.correct);
                    const isSelected = (letter === answered);
                    if (isSelected && isCorrect) btn.classList.add('correct');
                    else if (isSelected && !isCorrect) btn.classList.add('wrong');
                    else if (!isSelected && letter === data.correct && revealed[data.id]) {
                        btn.classList.add('reveal-correct');
                    }
                }

                btn.addEventListener('click', () => handleOptionClick(data.id, letter));
                optionsContainer.appendChild(btn);
            });

            // Show feedback if answered
            if (answers[data.id]) {
                showFeedback(data.id);
            } else {
                feedbackBox.classList.remove('show');
            }

            // Update nav
            prevBtn.disabled = (index === 0);
            nextBtn.textContent = (index === quizData.length - 1) ? 'Finish ✓' : 'Next ▶';

            // Progress
            const total = quizData.length;
            progressText.textContent = `Question ${index + 1} / ${total}`;
            progressFill.style.width = `${((index + 1) / total) * 100}%`;

            // Score
            updateScore();
        }

        function handleOptionClick(qId, letter) {
            // If already answered, ignore
            if (answers[qId]) return;

            const data = quizData.find(d => d.id === qId);
            if (!data) return;

            // Record answer
            answers[qId] = letter;
            revealed[qId] = true;

            // Re-render
            renderQuestion(currentIndex);

            // Auto-advance after a short delay?
            // We'll let user click next manually.
        }

        function showFeedback(qId) {
            const data = quizData.find(d => d.id === qId);
            if (!data) return;
            const answer = answers[qId];
            if (!answer) {
                feedbackBox.classList.remove('show');
                return;
            }

            const isCorrect = (answer === data.correct);
            const correctLetter = data.correct.toUpperCase();
            const answerText = data.options[optionLetters.indexOf(data.correct)];

            feedbackBox.classList.add('show');
            if (isCorrect) {
                feedbackIcon.textContent = '✅';
                feedbackText.innerHTML = `<span class="fb-correct">Correct!</span> The correct answer is <span class="fb-answer">${correctLetter}</span>.`;
            } else {
                feedbackIcon.textContent = '❌';
                feedbackText.innerHTML =
                    `<span class="fb-wrong">Incorrect.</span> The correct answer is <span class="fb-answer">${correctLetter}</span>: “${answerText}”.`;
            }
        }

        function updateScore() {
            let correct = 0;
            let totalAnswered = 0;
            quizData.forEach(d => {
                if (answers[d.id]) {
                    totalAnswered++;
                    if (answers[d.id] === d.correct) correct++;
                }
            });
            scoreBadge.textContent = `✅ ${correct} correct`;
            return { correct, totalAnswered };
        }

        function getStats() {
            let correct = 0,
                wrong = 0,
                unanswered = 0;
            quizData.forEach(d => {
                if (answers[d.id]) {
                    if (answers[d.id] === d.correct) correct++;
                    else wrong++;
                } else {
                    unanswered++;
                }
            });
            return { correct, wrong, unanswered };
        }

        // --------------------------------------------------------------
        // NAVIGATION
        // --------------------------------------------------------------
        function goTo(index) {
            if (index < 0) index = 0;
            if (index >= quizData.length) index = quizData.length - 1;
            currentIndex = index;
            renderQuestion(currentIndex);
            // Scroll to top of card
            document.querySelector('.question-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showResults() {
            questionArea.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            const stats = getStats();
            finalScoreNum.textContent = stats.correct;
            correctCount.textContent = stats.correct;
            wrongCount.textContent = stats.wrong;
            unansweredCount.textContent = stats.unanswered;

            let msg = '';
            const pct = (stats.correct / quizData.length) * 100;
            if (pct >= 90) msg = '🌟 Excellent! Masterful performance.';
            else if (pct >= 75) msg = '👏 Great job! Strong knowledge.';
            else if (pct >= 60) msg = '📖 Good effort. Review the topics you missed.';
            else if (pct >= 45) msg = '🔁 Needs more review. Keep studying!';
            else msg = '📚 Consider a thorough review of the material.';
            finalMessage.textContent = msg;
        }

        function resetQuiz() {
            answers = {};
            revealed = {};
            currentIndex = 0;
            resultScreen.classList.add('hidden');
            questionArea.classList.remove('hidden');
            renderQuestion(0);
        }

        // --------------------------------------------------------------
        // EVENT LISTENERS
        // --------------------------------------------------------------
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) goTo(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            const data = quizData[currentIndex];
            // If current question unanswered, allow navigation but warn?
            if (!answers[data.id]) {
                // Allow moving forward but mark as unanswered
                // We'll just move
            }
            if (currentIndex === quizData.length - 1) {
                // Finish
                showResults();
            } else {
                goTo(currentIndex + 1);
            }
        });

        resetBtn.addEventListener('click', resetQuiz);
        restartBtn.addEventListener('click', resetQuiz);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
            if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
        });

        // --------------------------------------------------------------
        // INIT
        // --------------------------------------------------------------
        renderQuestion(0);

        console.log('📋 Quiz loaded — 61 questions. Good luck!');
    </script>
